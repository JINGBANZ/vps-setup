name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax check (bash -n)
        run: |
          for f in bootstrap.sh setup.sh lib/*.sh modules/*.sh macos/*.sh linux/*.sh tests/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: ShellCheck
        # -S warning: fail on real problems, ignore info/style nits so CI tracks
        # correctness, not formatting. -x follows `source`d files.
        run: shellcheck -x -S warning bootstrap.sh setup.sh lib/*.sh modules/*.sh macos/*.sh linux/*.sh tests/*.sh

  onboarding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zsh for the startup matrix
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Shared Linux/macOS onboarding (isolated provisioning commands)
        # Use Apple's Bash 3.2 on macOS, rather than Homebrew's newer bash.
        run: |
          source lib/terminal-ui.sh
          trap ui_cleanup EXIT
          ui_gum_download
          export GUM_TEST_BIN="$UI_GUM_BIN"
          source tests/prepare-nvm-test.sh
          trap 'ui_cleanup; rm -f "$NVM_TEST_SCRIPT"' EXIT
          /bin/bash tests/test-onboarding.sh

  ssh-startup:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      VPS_SETUP_SSH_TEST_CONTAINER: '1'
    steps:
      - name: Install isolated SSH test prerequisites
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl python3 openssh-client openssh-server zsh tmux mosh
      - uses: actions/checkout@v4
      - name: Real SSH shell startup, Mosh server and tmux shortcut
        shell: bash
        run: |
          source tests/prepare-nvm-test.sh
          trap 'rm -f "$NVM_TEST_SCRIPT"' EXIT
          python3 tests/test-ssh-startup.py

  # Regression guard for the fresh-box install hang: debconf/needrestart trying
  # to prompt with no TTY (the `curl | sudo bash` path). Runs on the two Ubuntu
  # LTS releases that ship needrestart by default.
  noninteractive-apt:
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04']
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install test prerequisites
        # Minimal Ubuntu images lack git (needed by checkout) and CA certs.
        run: |
          apt-get update
          apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - name: apt_get wrapper sets non-interactive env (mechanism)
        run: bash tests/test-apt-env.sh
      - name: Fresh-box install does not hang (end-to-end)
        run: bash tests/test-fresh-install.sh
      - name: Shared onboarding installs a real selected apt package and reruns
        run: bash tests/test-linux-apt-onboarding.sh

